services:
  postgres:
    image: postgres:16-alpine
    container_name: mz-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mach_zero
      POSTGRES_PASSWORD: mach_zero
      POSTGRES_DB: mach_zero
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  questdb:
    image: questdb/questdb:latest
    container_name: mz-questdb
    ports:
      - "0.0.0.0:9000:9000"   # Web console & REST API (public for Vercel)
      - "127.0.0.1:9009:9009" # ILP ingestion (local only)
      - "127.0.0.1:8812:8812" # PostgreSQL wire (local only)
    volumes:
      - ./data/questdb:/var/lib/questdb
    restart: unless-stopped

  aeron-driver:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.aeron-driver
    container_name: mz-aeron-driver
    ipc: host
    volumes:
      - /dev/shm:/dev/shm
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.gateway
    container_name: mz-gateway
    ipc: host
    volumes:
      - /dev/shm:/dev/shm
    depends_on:
      - questdb
      - aeron-driver
    restart: unless-stopped

  engine:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.engine
    container_name: mz-engine
    ipc: host
    volumes:
      - /dev/shm:/dev/shm
      - ./tenant_limits.json:/var/run/mach-zero/tenant_limits.json:ro
    environment:
      - TENANT_LIMITS_FILE=/var/run/mach-zero/tenant_limits.json
    depends_on:
      - gateway
      - aeron-driver
    restart: unless-stopped

  risk-monitor:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.risk
    container_name: mz-risk-monitor
    ipc: host
    ports:
      - "8080:8080"   # HTTP control plane (kill-switch)
    volumes:
      - /dev/shm:/dev/shm
      - ./tenant_limits.json:/var/run/mach-zero/tenant_limits.json:ro
    environment:
      - TENANT_LIMITS_FILE=/var/run/mach-zero/tenant_limits.json
    depends_on:
      - engine
      - aeron-driver
    restart: unless-stopped

  persistence:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.persistence
    container_name: mz-persistence
    ipc: host
    volumes:
      - /dev/shm:/dev/shm
    environment:
      - QUESTDB_HOST=questdb
      - QUESTDB_PORT=9009
    depends_on:
      - questdb
      - gateway
      - aeron-driver
    restart: unless-stopped

  bridge:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.bridge
    container_name: mz-bridge
    ports:
      - "3002:3002"   # HTTP + WebSocket bridge
    ipc: host
    volumes:
      - /dev/shm:/dev/shm
    environment:
      - QUESTDB_URL=http://questdb:9000
    depends_on:
      - questdb
    restart: unless-stopped

  mock-exchange:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.mock-exchange
    container_name: mz-mock-exchange
    ipc: host
    volumes:
      - /dev/shm:/dev/shm
    depends_on:
      - gateway
      - aeron-driver
    profiles:
      - mock
    restart: unless-stopped
