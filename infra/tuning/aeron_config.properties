# Aeron Media Driver configuration for production low-latency
# Launch: java -cp aeron-all.jar io.aeron.driver.MediaDriver aeron_config.properties

# Threading mode: DEDICATED gives each conductor/sender/receiver its own thread
aeron.threading.mode=DEDICATED

# IPC publication buffer (64MB for large bursts)
aeron.ipc.term.buffer.length=67108864

# Publication buffer size (16MB)
aeron.term.buffer.length=16777216

# Conductor idle strategy: busy-spin for lowest latency (uses 100% CPU)
aeron.conductor.idle.strategy=org.agrona.concurrent.BusySpin

# Sender/receiver idle strategies
aeron.sender.idle.strategy=org.agrona.concurrent.BusySpin
aeron.receiver.idle.strategy=org.agrona.concurrent.BusySpin

# Pre-touch memory to avoid page faults
aeron.pre.touch.mapped.memory=true

# Disable bounds checking for performance
aeron.disable.bounds.checks=true

# Timer interval (1ms)
aeron.timer.interval=1000000

# Client liveness timeout (10s)
aeron.client.liveness.timeout=10000000000

# Publication unblock timeout (15s)
aeron.publication.unblock.timeout=15000000000

# Use /dev/shm for shared memory (Linux)
aeron.dir=/dev/shm/aeron-mach-zero
