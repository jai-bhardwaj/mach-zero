services:
  questdb:
    image: questdb/questdb:latest
    container_name: mz-questdb
    ports:
      - "127.0.0.1:9000:9000"   # Web console (localhost only)
      - "127.0.0.1:9009:9009"   # ILP ingestion
      - "127.0.0.1:8812:8812"   # PostgreSQL wire protocol
    volumes:
      - questdb-data:/var/lib/questdb
    environment:
      - QDB_HTTP_MIN_ENABLED=false
    restart: unless-stopped

  aeron-driver:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.aeron-driver
    container_name: mz-aeron-driver
    ipc: host
    volumes:
      - /dev/shm:/dev/shm
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.gateway
    container_name: mz-gateway
    ipc: host
    volumes:
      - /dev/shm:/dev/shm
    depends_on:
      - questdb
      - aeron-driver
    restart: unless-stopped

  engine:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.engine
    container_name: mz-engine
    ipc: host
    volumes:
      - /dev/shm:/dev/shm
      - ./tenant_limits.json:/var/run/mach-zero/tenant_limits.json:ro
    environment:
      - TENANT_LIMITS_FILE=/var/run/mach-zero/tenant_limits.json
    depends_on:
      - gateway
      - aeron-driver
    restart: unless-stopped

  risk-monitor:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.risk
    container_name: mz-risk-monitor
    ipc: host
    ports:
      - "127.0.0.1:8080:8080"   # HTTP control plane (localhost only)
    volumes:
      - /dev/shm:/dev/shm
      - ./tenant_limits.json:/var/run/mach-zero/tenant_limits.json:ro
    environment:
      - TENANT_LIMITS_FILE=/var/run/mach-zero/tenant_limits.json
    depends_on:
      - engine
      - aeron-driver
    restart: unless-stopped

  persistence:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.persistence
    container_name: mz-persistence
    ipc: host
    volumes:
      - /dev/shm:/dev/shm
    environment:
      - QUESTDB_HOST=questdb
      - QUESTDB_PORT=9009
    depends_on:
      - questdb
      - gateway
      - aeron-driver
    restart: unless-stopped

  mock-exchange:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.mock-exchange
    container_name: mz-mock-exchange
    ipc: host
    volumes:
      - /dev/shm:/dev/shm
    depends_on:
      - gateway
      - aeron-driver
    profiles:
      - mock
    restart: unless-stopped

volumes:
  questdb-data:
