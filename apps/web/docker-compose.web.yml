version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mach_zero
      POSTGRES_PASSWORD: mach_zero
      POSTGRES_DB: mach_zero
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mach_zero"]
      interval: 5s
      timeout: 5s
      retries: 5

  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    volumes:
      - /dev/shm:/dev/shm:ro
      - ../../research/bridge:/app/shm_reader_src:ro
    environment:
      - PYTHONPATH=/app/shm_reader_src

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://mach_zero:mach_zero@postgres:5432/mach_zero
      NEXTAUTH_SECRET: mach-zero-production-secret
      NEXTAUTH_URL: http://localhost:3000
      QUESTDB_URL: http://questdb:9000
      KILL_SWITCH_URL: http://risk-monitor:8080
      BRIDGE_HTTP_URL: http://bridge:3002
      NEXT_PUBLIC_BRIDGE_WS_URL: ws://localhost:3002/ws/live
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
